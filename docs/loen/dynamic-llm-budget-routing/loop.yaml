protected_scope:
  - user source notes
quality_gates:
  - Record settings and session id for every variant.
  - Preserve strict validation.
  - Reject reserved frame markers inside article Markdown.
  - Never infer an update target from retrieval rank alone.
  - Preserve consolidated evidence instead of dropping capped entities.
verifier:
  command: node --import tsx --test tests/framed-output.test.ts tests/structured-output.test.ts tests/ingest-evidence.test.ts tests/synthesis-evidence-ledger.test.ts tests/ingest-synthesis.test.ts tests/ingest-bounded.test.ts
budget:
  max_variants: 5
stop_conditions:
  - Two consecutive variants blocked by the same external endpoint condition.
handoff_conditions:
  - Obsidian must be manually restarted for each live variant.
rollback_policy: Restore evidence/baseline-data.json to test vault data.json.
run:
  plan_approved: true
  plan_hash: stable-grounding-wire-compatibility-v1
  mode: research
  subtype: regression-repair
